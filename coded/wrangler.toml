# Local development only: `npm run dev -- --var STAGE:2` runs stage 2 on http://localhost:8787.
# The five live stages are deployed as Cloudflare Pages projects: see scripts/deploy.sh and README.md.
name = "team-sufra-local"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "site"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "team-sufra-local"
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
STAGE = "4"
MODEL = "claude-haiku-5-5"   # the smallest model that passed every test
EFFORT = "low"
DAILY_LIMIT = "200"          # stage 3: new enquiries per caterer per day; the caterer can lower it
DAILY_BUDGET_USD = "5"       # safety cap on model spend per caterer per day, at every stage


<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Sufra: caterer inbox</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
<style>
  .layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; min-height: 70vh; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .list-col { border-right: 1px solid var(--line); background: #fbfbfd; }
  .list-col h1 { font-size: 15px; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .list-col h1 span { color: var(--muted); font-weight: 400; font-size: 13px; }
  .list { display: flex; flex-direction: column; }
  .item { text-align: left; font: inherit; color: inherit; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; cursor: pointer; }
  .item:hover { background: var(--tint); }
  .item[aria-current] { background: #fff; box-shadow: inset 3px 0 0 var(--orchid); }
  .item .first { font-size: 14px; margin: 6px 0 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .meta { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  #detail { padding: 20px 24px 28px; }
  .approval { border-radius: var(--radius); background: #fff; border: 1px solid var(--line-2); padding: 18px 20px; }
  .approval.need { border-color: #f1d4d4; }
  .approval .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
  .approval .head b { font-size: 17px; }
  .approval .summary { color: var(--ink-2); margin: 4px 0 10px; }
  .approval .total td { font-weight: 700; border-bottom: 0; font-size: 17px; padding-top: 12px; }
  .cols2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
  @media (max-width: 1100px) { .cols2 { grid-template-columns: 1fr; } }
  .approval h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .preview { background: #f3eff7; border-radius: var(--radius); padding: 12px; }
  .preview div { background: #fff; border-radius: 10px; padding: 10px 13px; font-size: 14px; white-space: pre-wrap; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .convo { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .convo div { padding: 8px 12px; background: var(--panel); font-size: 14px; white-space: pre-wrap; border-radius: 10px; }
  .convo .client { background: #f3eff7; }
  .convo .agent { background: var(--wash); }
  .convo small { color: var(--muted); display: block; font-size: 11.5px; font-weight: 600; }
  .read { margin-top: 18px; }
  .read pre { margin: 6px 0 0; }
</style>
</head>
<body>
<main class="wrap"><div class="demo" id="demo"></div><div id="main"></div></main>
<script src="common.js"></script>
<script>
const UNIT = { guest: "guests", child: "children", cake: "cakes", person: "staff" };
let st, enquiries = [], current = null, editing = false;

function demoBar() {
  // Buttons for the presenter. "Restart" does to this stage what restarting the program does.
  $("#demo").innerHTML = `<span>Demo:</span><button class="btn ghost" id="restart">Restart the program</button><button class="btn ghost" id="reset">Reset the demo</button>${st.features.login ? `<button class="btn ghost" id="out">Log out</button>` : ""}<span id="said"></span>`;
  $("#restart").onclick = async () => {
    const r = await (await api("/api/restart", {})).json();
    $("#said").textContent = r.kept ? "Restarted. Everything is still here: it is stored in the database." : "Restarted. The inbox is empty: it lived only in the program's memory.";
    current = null; refresh();
  };
  $("#reset").onclick = async () => { await api("/api/reset", {}); $("#said").textContent = "Reset: no enquiries, the standard price list."; current = null; refresh(); };
  if ($("#out")) $("#out").onclick = logOut;
}

function itemHtml(q) {
  return `<button class="item" data-id="${q.id}" ${current && current.id === q.id ? "aria-current=true" : ""}>
    <div class="meta"><span>${statusChip(q.status)}</span><span>${ago(q.updated_at)}</span></div>
    <div class="first" dir="auto">${esc(q.first)}</div>
    <div class="meta"><span>${q.quote ? money(q.quote.total, q.quote.currency) : ""}</span></div></button>`;
}

function quoteTable(q) {
  return q.lines.map(l => `<tr><td>${esc(l.name)}${(["guest", "child"].includes(l.unit) || l.qty > 1) && UNIT[l.unit] ? ` × ${l.qty} ${UNIT[l.unit]}` : ""}</td><td class="num">${money(l.amount, q.currency)}</td></tr>`).join("") +
    (q.rush ? `<tr><td>Rush fee</td><td class="num">${money(q.rushFee, q.currency)}</td></tr>` : "") +
    `<tr class="total"><td>Total</td><td class="num">${money(q.total, q.currency)}</td></tr>`;
}

function detailHtml(q) {
  const who = m => m.sender === "client" ? "Client" : m.sender === "agent" ? "The agent" : `You (${st.me})`;
  const convo = `<h3 style="margin-top:18px">Conversation</h3><div class="convo">${q.messages.map(m => `<div class="${m.sender}" dir="auto"><small>${who(m)} · ${time(m.at)}</small>${esc(m.text)}</div>`).join("")}</div>`;
  // What the model actually read: before stage 3 it sees phone numbers and emails as typed
  const reads = q.events.filter(e => e.step === "read");
  const read = reads.length ? `<details class="read"><summary>What the model read</summary><pre dir="auto">${esc(reads[reads.length - 1].detail.model_read)}</pre>
    <p class="muted" style="font-size:13px;margin:6px 0 0">${st.features.mask ? "Phone numbers and emails are hidden before the model reads a message. You still see the original above." : "Until stage 3 the model reads phone numbers and emails exactly as the client typed them."}</p></details>` : "";
  let card = "";
  if (q.status === "awaiting_approval" && !q.quote) {
    card = `<div class="approval"><div class="head"><b>The agent wants to ask the client</b></div>
      ${editing ? `<textarea id="draft" dir="auto" rows="4">${esc(q.draft)}</textarea>` : `<div class="preview"><div dir="auto">${esc(q.draft)}</div></div>`}
      <div class="actions">${editing ? `<button class="btn amber" data-act="approve-edit">Send edited question</button><button class="btn ghost" data-act="stop-edit">Undo edits</button>`
        : `<button class="btn amber" data-act="approve">Approve and send</button><button class="btn ghost" data-act="edit">Edit</button>`}<button class="btn danger" data-act="reject">Reject</button></div></div>`;
  } else if (q.status === "awaiting_approval" && q.quote) {
    // Stage 2: the price list changed after this draft. Show both and let the caterer choose.
    const both = q.current ? `<div class="both"><b>Your price list changed after this draft.</b><br>Drafted at ${money(q.quote.total, q.quote.currency)} on ${time(q.drafted_at)}. At today's prices: ${money(q.current.quote.total, q.current.quote.currency)}.</div>` : "";
    const approve = q.current
      ? `<button class="btn amber" data-act="approve-current">Send at today's price (${money(q.current.quote.total, q.current.quote.currency)})</button><button class="btn ghost" data-act="approve">Send at the drafted price (${money(q.quote.total, q.quote.currency)})</button>`
      : `<button class="btn amber" data-act="approve">Approve and send</button><button class="btn ghost" data-act="edit">Edit</button>`;
    card = `<div class="approval"><div class="head"><b>Awaiting your approval</b></div>
      <div class="cols2"><div><p class="summary" dir="auto">${esc(q.summary || "")}</p>
      <table>${quoteTable(q.quote)}</table>${both}
      <p class="muted" style="font-size:13px;margin:8px 0 0">Prices come from your price list, not the model.</p>
      <div class="actions">${editing ? `<button class="btn amber" data-act="approve-edit">Send edited message</button><button class="btn ghost" data-act="stop-edit">Undo edits</button>` : approve}<button class="btn danger" data-act="reject">Reject</button></div>
      </div><div><h3>What the client will see</h3>
      ${editing ? `<textarea id="draft" dir="auto" rows="10">${esc(q.draft)}</textarea>` : `<div class="preview"><div dir="auto">${esc(q.draft)}</div></div>`}</div></div></div>`;
  } else if (q.status === "handed_over" || q.status === "failed") {
    card = `<div class="approval need"><div class="head"><b>${q.status === "failed" ? "The agent failed: over to you" : "Handed to you"}</b></div>
      <p style="margin:0 0 10px">${esc(q.reason || "The agent handed this enquiry to you.")}</p>
      <textarea id="reply" dir="auto" placeholder="Write your reply to the client">${q.draft ? esc(q.draft) : ""}</textarea>
      <div class="actions"><button class="btn amber" data-act="reply">Send reply</button><button class="btn danger" data-act="reject">Close</button></div></div>`;
  } else {
    card = `<div class="card"><b>${statusChip(q.status)}</b>${q.status === "asked" || q.status === "open" ? `<p>Nothing for you to decide yet. The agent is waiting for the client.</p>` : q.quote ? `<p dir="auto">${esc(q.summary || "")}</p><p class="muted" style="margin:0">Quote: ${money(q.quote.total, q.quote.currency)}</p>` : q.status === "reading" ? `<p>The agent never finished reading this enquiry. Before stage 3, nothing catches a failure.</p>` : ""}</div>`;
  }
  return card + convo + read + (st.features.deletion ? `<p class="muted" style="font-size:13px;margin-top:14px">Deleted automatically on ${dateShort(q.expires_at.slice(0, 10))}, 30 days after the last message.</p>` : "");
}

function render() {
  const waiting = enquiries.filter(q => ["awaiting_approval", "handed_over", "failed"].includes(q.status)).length;
  $("#main").innerHTML = `<div class="layout"><div class="list-col"><h1>Inbox <span>${waiting} need${waiting === 1 ? "s" : ""} you</span></h1><div class="list">${enquiries.length ? enquiries.map(itemHtml).join("") : `<p class="muted" style="padding:12px 16px;margin:0">No enquiries. Send one from the client chat.</p>`}</div></div><div id="detail">${current && current.messages ? detailHtml(current) : `<p class="muted">Pick an enquiry.</p>`}</div></div>`;
}

async function refresh() {
  const data = await catererGet("/api/inbox", $("#main"), st);
  if (!data) { $("#demo").innerHTML = ""; return; }
  if (!data.enquiries) { $("#main").innerHTML = `<p class="err">${esc(data.error || "The inbox could not load.")}</p>`; return; }
  enquiries = data.enquiries; st.me = data.caterer;
  $("#sub").textContent = st.features.login ? `You are ${data.caterer}, logged in` : `You are ${data.caterer}. No login: anyone with this link gets in.`;
  if (!$("#restart")) demoBar();
  const id = current ? current.id : enquiries[0] && enquiries[0].id;
  if (id) await open(id, true); else { current = null; render(); }
}
async function open(id, quiet) {
  if (editing && quiet) return; // keep the caterer's edits while the list refreshes
  editing = false;
  const r = await api(`/api/inbox/${id}`);
  current = r.ok ? await r.json() : null;
  render();
}
document.addEventListener("click", async e => {
  const it = e.target.closest(".item"); if (it) return open(it.dataset.id);
  const b = e.target.closest("[data-act]"); if (!b || !current) return;
  const act = b.dataset.act;
  if (act === "edit") { editing = true; return render(); }
  if (act === "stop-edit") { editing = false; return render(); }
  b.disabled = true;
  if (act === "approve") await api(`/api/inbox/${current.id}/approve`, { price: "drafted" });
  if (act === "approve-current") await api(`/api/inbox/${current.id}/approve`, { price: "current" });
  if (act === "approve-edit") await api(`/api/inbox/${current.id}/approve`, { text: $("#draft").value });
  if (act === "reject") await api(`/api/inbox/${current.id}/reject`, {});
  if (act === "reply") { const t = $("#reply").value.trim(); if (!t) { b.disabled = false; return; } await api(`/api/inbox/${current.id}/reply`, { text: t }); }
  editing = false;
  refresh();
});
frame("The caterer's inbox").then(s => { st = s; refresh(); setInterval(() => { if (!editing && st.me && !document.activeElement?.matches("textarea")) refresh(); }, 4000); });
</script>
</body>
</html>
